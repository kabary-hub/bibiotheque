# =============================================================================
#  Configuration appliquee aux tests uniquement
# =============================================================================
#  src/test/resources prime sur src/main/resources pendant les tests. Le fichier
#  de production n'est pas modifie : les tests pointent sur une base en memoire
#  au lieu du PostgreSQL de localhost:5432, qui n'existe pas sur une machine de
#  construction.
#
#  MODE=PostgreSQL : H2 imite la syntaxe et les types de PostgreSQL. Sans ce
#  mode, un test pourrait passer sur une requete que le vrai moteur refuse.
# =============================================================================

spring.datasource.url=jdbc:h2:mem:bibliotheque;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Remplace PostgreSQL10Dialect, qui ne sait pas parler a H2.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Le balayage d'expiration ne doit pas se declencher pendant les tests : il
# modifierait les statuts sous les pieds des assertions. Un delai initial d'une
# heure le neutralise sans desactiver la planification.
bibliotheque.reservation.expiration.delai-initial-ms=3600000
bibliotheque.reservation.expiration.periode-ms=3600000
