server.port=8080

# =============================================================================
#  Base de donnees — PostgreSQL
# =============================================================================
#  Ces valeurs sont celles d'un poste de developpement. En conteneur, elles sont
#  surchargees par les variables SPRING_DATASOURCE_* de docker-compose.yml : les
#  variables d'environnement priment sur ce fichier dans l'ordre de priorite de
#  Spring Boot.
# =============================================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/bibliotheque
spring.datasource.username=bibliotheque
spring.datasource.password=bibliotheque
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de connexions : des bornes explicites valent mieux que le defaut, qui
# ouvre dix connexions et attend trente secondes avant d'admettre un echec.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# =============================================================================
#  JPA / Hibernate
# =============================================================================
#  PostgreSQL10Dialect et non PostgreSQL95Dialect : c'est celui qui declare le
#  type IDENTITY natif, utilise par Borrow, Role et Reservation.
# =============================================================================

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Sans ce reglage, Hibernate interroge la base a chaque demarrage pour savoir si
# elle supporte getGeneratedKeys, et journalise un avertissement bruyant quand la
# connexion n'est pas encore etablie.
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# open-in-view ouvre une session Hibernate pour toute la duree de la requete HTTP,
# y compris pendant la serialisation JSON. C'est actif par defaut et c'est ce qui
# masque les chargements paresseux imprevus jusqu'a la production. On le coupe :
# le service doit avoir termine son travail avant que le controleur reponde.
spring.jpa.open-in-view=false

# =============================================================================
#  Journalisation
# =============================================================================

logging.level.org.hibernate.SQL=warn
logging.level.com.ibizabroker.bibliotheque=info
