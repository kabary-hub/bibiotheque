<div class="action-menu" [class.action-menu--open]="open">
  <button type="button" class="action-menu__trigger" (click)="toggle($event)"
          [attr.aria-expanded]="open" aria-haspopup="true" aria-label="Actions">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
    </svg>
  </button>
  <div class="action-menu__dropdown" *ngIf="open" role="menu">
    <button *ngFor="let item of items; let i = index"
            type="button"
            class="action-menu__item"
            [class.action-menu__item--danger]="item.danger"
            role="menuitem"
            (click)="onAction(i)">
      {{ item.label }}
    </button>
  </div>
</div>
