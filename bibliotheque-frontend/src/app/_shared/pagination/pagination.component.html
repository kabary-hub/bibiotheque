<div class="pagination" *ngIf="totalPages > 1">
  <button type="button" class="pagination__btn" [disabled]="currentPage === 1" (click)="prev()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>

  <button *ngFor="let p of pages" type="button"
          class="pagination__btn"
          [class.pagination__btn--active]="p === currentPage"
          [class.pagination__btn--dots]="p === '...'"
          [disabled]="p === '...'"
          (click)="goTo(p)">
    {{ p }}
  </button>

  <button type="button" class="pagination__btn" [disabled]="currentPage === totalPages" (click)="next()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>

  <span class="pagination__info">{{ totalItems }} élément(s)</span>
</div>
