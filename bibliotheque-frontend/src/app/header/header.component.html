<nav class="app-nav" role="navigation" aria-label="Navigation principale">
  <div class="app-nav__inner">

    <a routerLink="/" class="app-nav__brand" aria-label="Accueil">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span>Bibliothèque</span>
    </a>

    <button class="app-nav__toggle" type="button"
            (click)="menuOpen = !menuOpen"
            [attr.aria-expanded]="menuOpen"
            aria-controls="main-menu"
            aria-label="Menu">
      <svg *ngIf="!menuOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      <svg *ngIf="menuOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <div class="app-nav__menu" id="main-menu" [class.app-nav__menu--open]="menuOpen">
      <ul class="app-nav__links" role="list">

        <ng-container *ngIf="userService.roleMatch(['Admin'])">
          <li><a routerLink="/books"        routerLinkActive="app-nav__link--active" class="app-nav__link" (click)="menuOpen=false">Livres</a></li>
          <li><a routerLink="/create-book"  routerLinkActive="app-nav__link--active" class="app-nav__link" (click)="menuOpen=false">Ajouter un livre</a></li>
          <li><a routerLink="/users"        routerLinkActive="app-nav__link--active" class="app-nav__link" (click)="menuOpen=false">Utilisateurs</a></li>
          <li><a routerLink="/register-user" routerLinkActive="app-nav__link--active" class="app-nav__link" (click)="menuOpen=false">Ajouter un utilisateur</a></li>
          <li><a routerLink="/reservations" routerLinkActive="app-nav__link--active" class="app-nav__link" (click)="menuOpen=false">Réservations</a></li>
        </ng-container>

        <ng-container *ngIf="userService.roleMatch(['User'])">
          <li><a routerLink="/my-books"    routerLinkActive="app-nav__link--active" class="app-nav__link" (click)="menuOpen=false">Mes livres</a></li>
          <li><a routerLink="/borrow-book" routerLinkActive="app-nav__link--active" class="app-nav__link" (click)="menuOpen=false">Emprunter</a></li>
          <li><a routerLink="/return-book" routerLinkActive="app-nav__link--active" class="app-nav__link" (click)="menuOpen=false">Retour</a></li>
        </ng-container>

      </ul>

      <div class="app-nav__end">
        <span *ngIf="isLoggedIn()" class="app-nav__user" [attr.aria-label]="'Connecté en tant que ' + name">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          {{ name }}
        </span>
        <button *ngIf="!isLoggedIn()" class="btn btn-primary btn-sm" routerLink="/login" (click)="menuOpen=false">Se connecter</button>
        <button *ngIf="isLoggedIn()"  class="btn btn-secondary btn-sm" (click)="logout()">Se déconnecter</button>
      </div>
    </div>

  </div>
</nav>
