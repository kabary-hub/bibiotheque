<div class="form-page">
  <div class="card form-card">
    <div class="card-header">
      <h2 class="card-title">Edit Book</h2>
    </div>
    <div class="card-body">
      <div *ngIf="erreur" class="alert alert--danger" role="alert">
        <div class="alert-body">{{ erreur }}</div>
      </div>
      <form (ngSubmit)="onSubmit()" autocomplete="off" #f="ngForm">
        <div class="form-grid">
          <div class="field">
            <label class="label" for="bookName">Book title <span class="required" aria-hidden="true">*</span></label>
            <input class="input" type="text" id="bookName" name="bookName" [(ngModel)]="book.bookName" required>
          </div>
          <div class="field">
            <label class="label" for="bookAuthor">Author <span class="required" aria-hidden="true">*</span></label>
            <input class="input" type="text" id="bookAuthor" name="bookAuthor" [(ngModel)]="book.bookAuthor" required>
          </div>
          <div class="field">
            <label class="label" for="bookGenre">Genre</label>
            <input class="input" type="text" id="bookGenre" name="bookGenre" [(ngModel)]="book.bookGenre">
          </div>
          <div class="field">
            <label class="label" for="noOfCopies">Number of copies <span class="required" aria-hidden="true">*</span></label>
            <input class="input" type="number" id="noOfCopies" name="noOfCopies" [(ngModel)]="book.noOfCopies" required min="0">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit" [disabled]="f.invalid || envoiEnCours">
            <span *ngIf="envoiEnCours" class="spinner spinner--sm" aria-hidden="true"></span>
            {{ envoiEnCours ? 'Saving...' : 'Save changes' }}
          </button>
          <a routerLink="/books" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
