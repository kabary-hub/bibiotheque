<div class="card-body--flush">
  <div class="table-wrap">
    <table class="table" aria-label="Reservation list">
      <thead>
        <tr>
          <th>#</th>
          <th>Book</th>
          <th>Member</th>
          <th>Status</th>
          <th>Reserved on</th>
          <th>Expires on</th>
          <th class="cell-actions">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of reservations">
          <td data-label="#" class="cell-muted">{{ r.id }}</td>
          <td data-label="Book" class="cell-strong">{{ r.livreTitre }}</td>
          <td data-label="Member">{{ r.adherentNom }}</td>
          <td data-label="Status">
            <span class="badge" [ngClass]="classeBadge(r.statut)">
              {{ libelle(r.statut) }}
            </span>
          </td>
          <td data-label="Reserved on">{{ r.dateReservation | date:'dd/MM/yyyy HH:mm' }}</td>
          <td data-label="Expires on">{{ r.dateExpiration | date:'dd/MM/yyyy HH:mm' }}</td>
          <td class="cell-actions">
            <button *ngIf="estAnnulable(r.statut)"
                    type="button"
                    class="btn btn-danger-ghost btn-sm"
                    (click)="demanderAnnulation(r)">
              Cancel
            </button>
            <span *ngIf="!estAnnulable(r.statut)" class="cell-muted">—</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
