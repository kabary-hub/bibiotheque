<div class="auth-wrap">
  <div class="card auth-card">
    <div class="card-body">
      <div class="auth-logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-sub">Enter your credentials to access the library.</p>

      <div *ngIf="erreur" class="alert alert--danger" role="alert">
        <div class="alert-body">{{ erreur }}</div>
      </div>

      <form autocomplete="off" #loginForm="ngForm" (ngSubmit)="login(loginForm)">
        <div class="field">
          <label class="label" for="loginUsername">Username</label>
          <input class="input" type="text" id="loginUsername" name="username"
                 ngModel required placeholder="your-username"
                 [class.field--invalid]="loginForm.submitted && !loginForm.controls['username']?.valid">
        </div>
        <div class="field">
          <label class="label" for="loginPassword">Password</label>
          <input class="input" type="password" id="loginPassword" name="password"
                 ngModel required placeholder="••••••••">
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit"
                [disabled]="envoiEnCours">
          <span *ngIf="envoiEnCours" class="spinner spinner--sm" aria-hidden="true"></span>
          {{ envoiEnCours ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>
    </div>
  </div>
</div>
