<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6">

      <h3 class="text-center mb-4">Edit User</h3>

      <div *ngIf="erreur" class="alert alert-danger" role="alert">
        {{ erreur }}
      </div>

      <form (ngSubmit)="onSubmit()" autocomplete="off" #f="ngForm">

        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name"
                 [(ngModel)]="user.name" name="name" required>
        </div>

        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username"
                 [(ngModel)]="user.username" name="username" required minlength="3">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">
            Password
            <span class="text-muted small">(leave blank to keep current)</span>
          </label>
          <input type="password" class="form-control" id="password"
                 [(ngModel)]="user.password" name="password">
        </div>

        <div class="mb-3">
          <label for="role" class="form-label">Role</label>
          <select id="role" name="role" class="form-select"
                  [(ngModel)]="roleLabel" (ngModelChange)="onRoleChange($event)">
            <option value="User">User</option>
            <option value="Admin">Admin</option>
          </select>
        </div>

        <div class="d-grid d-sm-flex gap-2">
          <button class="btn btn-success" type="submit"
                  [disabled]="f.invalid || envoiEnCours">
            <span *ngIf="envoiEnCours" class="spinner-border spinner-border-sm me-1"
                  aria-hidden="true"></span>
            {{ envoiEnCours ? 'Saving...' : 'Submit' }}
          </button>
          <a routerLink="/users" class="btn btn-outline-secondary">Cancel</a>
        </div>

      </form>
    </div>
  </div>
</div>
