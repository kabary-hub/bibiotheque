server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Repli sur index.html pour toute URL sans fichier correspondant.
    #
    # Angular est une application monopage : /books, /login ou /forbidden
    # n'existent pas sur le disque, ils sont resolus par le routeur Angular
    # une fois index.html charge. Sans ce try_files, un rechargement (F5) sur
    # /books renverrait un 404 nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les bundles produits par `ng build --configuration production` portent une
    # empreinte dans leur nom (outputHashing: all). Un nom de fichier change a
    # chaque version : ils peuvent donc etre mis en cache sans limite.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html, lui, ne doit jamais etre mis en cache : c'est lui qui pointe
    # vers les bundles empreintes. Le mettre en cache figerait l'application
    # sur une ancienne version.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
